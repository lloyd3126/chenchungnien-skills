interface:
  display_name: "Website Skill Builder"
  short_description: "Explore sites in the built-in browser and build skills"
  default_prompt: "Use $website-skill-builder in the Codex in-app browser, operating only the already-visible active tab; do not create temporary tabs or switch browsers. For every target, actually open it in that same tab and then take a visual screenshot; a navigation API result is never a substitute for opening and visual inspection. If a client-block, timeout, or empty automation result occurs, screenshot that same tab, retry the target in the same tab, and only then classify it; never claim the resource has no content or that the tab was reopened from an API result alone. Preserve earlier visual/download evidence. Confirm downloads and parse them when available. If the current session is visibly authenticated, re-check public areas and explore safe protected functionality; otherwise ask before manual sign-in and protected exploration."
